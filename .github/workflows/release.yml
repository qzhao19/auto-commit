name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # release creation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: script/test.sh
        env:
          AUTOCOMMIT_E2E_API_KEY: ${{ secrets.AUTOCOMMIT_E2E_API_KEY }}

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cross
      - run: script/build.sh aarch64-apple-darwin x86_64-apple-darwin
        if: runner.os == 'macOS'
      - run: script/build.sh aarch64-unknown-linux-musl x86_64-unknown-linux-musl
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: dist/*.tar.gz

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: assets-*
          merge-multiple: true
      - run: script/deploy.sh
        env:
          GH_TOKEN: ${{ github.token }}
