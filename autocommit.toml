# ─────────────────────────────────────────────────────────
# LLM Provider Configuration
# ─────────────────────────────────────────────────────────
[llm]
# The provider name of model (e.g., "openai")
provider = "openai"

# Model identifier (required)
# Examples: gpt-4o-mini, claude-3-5-sonnet, deepseek-v4-flash
model = "deepseek-v4-flash"

# Optional: Custom API base URL
# # Examples:
#   - https://api.deepseek.com/v1
#   - http://localhost:11434/v1 (for Ollama)
# Leave empty for default provider endpoint
baseUrl = "https://api.deepseek.com"

# WARNING: Setting apiKey here is insecure. Use AUTOCOMMIT_LLM_API_KEY env var instead.

# Generation parameters (optional; each has a default)
temperature = 0.8
maxTokens = 4096
topP = 0.9
frequencyPenalty = 0
presencePenalty = 0

# ─────────────────────────────────────────────────────────
# Resilience Strategies
# ─────────────────────────────────────────────────────────

[resilience.retry]
maxRetries = 3
initialDelayMs = 1000
maxDelayMs = 10000
factor = 2
jitter = true

[resilience.timeout]
timeoutMs = 30000
