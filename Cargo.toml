[package]
name = "auto-commit"
version = "0.2.1"
edition = "2024"

[profile.release]
strip = true
lto = true
opt-level = "z"
panic = "abort"

[dependencies]
async-openai = { version = "0.41.1", features = ["chat-completion"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
# default features enable reqwest/default-tls (native-tls -> OpenSSL),
# which cannot be satisfied for musl cross builds
ollama-rs = { version = "0.3.5", default-features = false, features = ["rustls"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"

[[test]]
name = "e2e"
path = "tests/e2e/test_e2e.rs"
