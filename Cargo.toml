[package]
name = "auto-commit"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = true


[dependencies]
async-openai = { version = "0.41.1", features = ["chat-completion"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ollama-rs = "0.3.5"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
